# Beets configuration for RockBox pipeline (fingerprint-based, art embed, album/singles/missing handling)
# NOTE: Do not hardcode your AcoustID API key here. See the UI & secure-storage instructions.

# Library & storage
directory: "C:\\Users\\Main Tower\\Music\\BeetsLibrary"
library: "C:\\Users\\Main Tower\\Music\\beets_library.db"

# Plugins to enable. Additional custom plugins (see architecture) will be required:
plugins:
  - chroma         # fingerprinting (Chromaprint -> AcoustID)
  - fetchart       # download album art
  - embedart       # embed downloaded art into files
  - scrub          # clean bad tags before write
  - fromfilename   # fallback parsing from filename
  - missing        # list missing tracks / metadata
  - info           # debugging/info output
  - replaygain     # optional: compute replaygain
  - duplicates     # optional: help find duplicates
  # NOTE: custom plugins expected: earliest_release, missing_router
  # Add them to this list when implemented:
  # - earliest_release
  # - missing_router

# Import behavior
import:
  copy: yes            # copy source files into the organized library (keeps originals)
  move: no             # set move: yes if you want to move instead of copy
  write: yes           # write ID3/Vorbis tags to files
  autotag: yes         # allow beets to autotag via MB + AcoustID
  quiet_fallback: skip # skip interactive fallback
  resume: yes
  incremental: yes
  log: beets_import.log

# Cover art settings
art_filename: cover.jpg   # save fetched album art as "cover.jpg" in the album folder
fetchart:
  cautious: yes
  sources: coverart itunes amazon albumart
  minwidth: 400
  auto: yes

embedart:
  auto: yes
  remove_art_file: no

# Acoustic fingerprinting (Chromaprint / AcoustID)
chroma:
  auto: yes
  aggressive: yes
  force: no              # set to yes if you want fingerprints regenerated each import
  chunk: 120
  # The actual acoustid key must be provided at runtime or stored securely (see instructions).
acoustid:
  apikey: NONE           # DO NOT put your real key here; see secure storage instructions

# Save embed settings & replaygain
replaygain:
  backend: ffmpeg
  auto: no

# Tag cleaning rules
scrub:
  auto: yes

# Matching preferences
match:
  preferred:
    original_year: yes
  required: year
  ignored:
    - missing_tracks
    - unmatched_tracks
  # NOTE: earliest_release selection is handled by a custom plugin described below.

# Path templates:
# - Default album path: Artist / Album (with MusicBrainz uniqueness) / Track - Title
# - Single tracks (no album) go to Artist/Singles/Title.ext
paths:
  default: $albumartist/$album%aunique{}/$track - $title
  singleton: $artist/Singles/$title
  comp: Compilations/$album/$track - $title

# Missing-metadata support:
# The user-supplied "missing_router" plugin (see architecture) should route files into:
#   Missing Metadata/
#     Missing Track Name/
#     Missing Artist Name/
#     Missing Album Cover/
#     Missing Everything/
#
# The plugin exports summary metadata and places problematic files under the Missing Metadata tree.

# Misc
id3v2_utf8: yes
threaded: yes
version: 1

# End of Example config
